name: Portal Bug
description: Something on the dev portal itself is broken — layout, links, build, sitemap.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: false
